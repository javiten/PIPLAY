<!doctype html>
<html lang="__LANGUAGE__">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DEVICE_NAME__ · {{Configuración inicial}}</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,#17362b,#090e0d 65%);color:#edf7f1;font:16px system-ui,sans-serif}main{width:min(100%,410px);padding:32px;border:1px solid #315246;border-radius:24px;background:#101a17;box-shadow:0 20px 80px #0007;animation:appear .45s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}}@media(prefers-reduced-motion:reduce){main{animation:none}}svg{width:72px;height:72px}.tag{color:#8ae7ba;letter-spacing:.18em;font-size:.75rem;font-weight:700}h1{margin:8px 0;font-size:2.25rem}p{color:#b4c9bf}form{display:grid;gap:10px;margin-top:26px}input,button{font:inherit;width:100%;padding:12px;border-radius:10px}input{background:#090f0d;color:#edf7f1;border:1px solid #39584c;margin-bottom:8px}button{background:#8ae7ba;color:#10251a;border:0;font-weight:750;cursor:pointer}:focus-visible{outline:2px solid #8ae7ba;outline-offset:3px}.error{color:#ffb8a8}
a{color:#8ae7ba}
</style>
<main>
<h1>{{Configuración inicial}}</h1>
<p>{{Elegí el idioma y configurá tu pantalla.}}</p>
<nav aria-label="{{Idioma}}"><a href="/?lang=en" lang="en">English</a> · <a href="/?lang=es" lang="es">Español</a></nav>
<!-- ERROR -->
<form method="post" action="/setup">
<label for="code">{{Código de instalación}}</label>
<input id="code" name="code" required maxlength="128" autocomplete="off">
<label for="name">{{Nombre del dispositivo}}</label>
<input id="name" name="name" required maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9 _\-]{0,31}" value="__DEVICE_NAME__">
<small>{{Letras sin acentos, números, espacios, guiones o guiones bajos.}}</small>
<label for="user">{{Usuario}}</label>
<input id="user" name="user" required maxlength="64" pattern="[A-Za-z0-9_.\-]{1,64}" autocomplete="username">
<label for="password">{{Contraseña}}</label>
<input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
<small>{{Guardá una contraseña de al menos 12 caracteres.}}</small>
<label for="confirm">{{Confirmar contraseña}}</label>
<input id="confirm" name="confirm" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
<button>{{Crear administrador}}</button>
</form>
</main>
